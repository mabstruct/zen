[project]
name = "zen-tools"
version = "0.1.0"
description = "Deterministic tools for the ZEN vault: indexer and intake."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "markitdown[pdf,docx,pptx,xlsx]>=0.1.2",
]

[project.scripts]
zen-index = "zen.index_cli:main"
zen-intake = "zen.intake_cli:main"

[dependency-groups]
dev = ["pytest>=8", "python-docx>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
